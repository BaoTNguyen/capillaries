name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # capillaries sits at the bottom of the stack and imports no sibling, so
      # its own pyproject is the whole story. Editable rather than a hand-listed
      # set of packages: a dependency added to pyproject should not need a
      # second edit here to be tested.
      - run: pip install -e . pytest

      # `-m "not db"` drops the cases that need live Postgres and an embedding
      # endpoint. What is left is the retrieval logic itself, which is the part
      # a PR can actually break.
      - run: python -m pytest -q -m "not db"
