name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: '3.12'

      # capillaries sits at the bottom of the stack and imports no sibling at
      # module scope, so its own pyproject is the whole story. arteries is
      # deliberately absent here: this job is what proves the standalone import
      # still holds. The one test that constructs an arteries MemoryFrame skips.
      - run: uv sync

      # `-m "not db"` drops the cases that need live Postgres and an embedding
      # endpoint. What is left is the retrieval logic itself, which is the part
      # a PR can actually break.
      - run: uv run pytest -q -m "not db"
