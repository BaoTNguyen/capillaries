[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capillaries"
version = "0.1.0"
description = "Prompt search and management system with semantic retrieval"
requires-python = ">=3.10"
# arteries is required but undeclared: it isn't on PyPI, so declaring it would
# resolve to a stranger's package. Install the sibling first:
#   pip install -e ../arteries && pip install -e .
# Only `arteries.memory_types` is imported — stdlib dataclasses defining the
# MemoryFrame contract, with no psycopg2 or DB access on that path.
dependencies = [
    "psycopg2-binary>=2.9.0",
    "python-frontmatter>=1.0.0",
    "anthropic>=0.7.0",
    "openai>=1.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "aiohttp>=3.8.0",
    "httpx>=0.23.0",
    "python-dotenv>=0.19.0",
    "tqdm>=4.62.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
lightweight = [
    "sentence-transformers>=2.2.0",
    "annoy>=1.17.0",
    "networkx>=2.8.0",
    "python-louvain>=0.16",
    "spacy>=3.4.0",
    "diskcache>=5.4.0",
    "joblib>=1.1.0",
    "structlog>=22.1.0",
]
advanced = [
    "capillaries[lightweight]",
    "faiss-cpu>=1.7.4",
    "transformers>=4.21.0",
    "torch>=1.12.0",
    "umap-learn>=0.5.3",
    "hdbscan>=0.8.28",
    "redis>=4.3.0",
    "prometheus-client>=0.14.0",
]
obsidian = [
    "python-frontmatter>=1.0.0",
]
dev = [
    "pytest>=7.1.0",
    "pytest-asyncio>=0.19.0",
    "black>=22.6.0",
    "mypy>=0.971",
]

[project.scripts]
cap = "capillaries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a live Postgres + embedding endpoint (deselect with -m 'not db')",
]
