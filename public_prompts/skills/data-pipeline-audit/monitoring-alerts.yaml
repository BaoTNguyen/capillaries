# =============================================================
# Data Pipeline Monitoring Alerts
# =============================================================
# Prometheus alerting rules and Grafana dashboard hints for
# monitoring pipeline health, data freshness, and job status.
#
# Usage:
#   - Copy to your Prometheus rules directory (e.g., /etc/prometheus/rules/)
#   - Adjust thresholds to match your SLAs
#   - Replace placeholder labels with your actual job/pipeline names
#   - Reload Prometheus: kill -HUP $(pidof prometheus)
#
# Assumes you have these metrics exposed (via your pipeline
# framework, custom exporters, or pushgateway):
#   - pipeline_job_duration_seconds
#   - pipeline_job_last_success_timestamp
#   - pipeline_rows_processed_total
#   - pipeline_errors_total
#   - pipeline_data_freshness_seconds
# =============================================================

groups:
  - name: pipeline_health
    # Core pipeline operational alerts
    rules:

      # Alert when a pipeline job has not succeeded recently.
      # Threshold: no success in 2x the expected schedule interval.
      # Example: hourly job should succeed at least once every 2 hours.
      - alert: PipelineJobStale
        expr: >
          (time() - pipeline_job_last_success_timestamp) > 7200
        for: 5m
        labels:
          severity: critical
          team: data-engineering
        annotations:
          summary: "Pipeline job {{ $labels.job_name }} has not succeeded in over 2 hours"
          description: >
            The pipeline job {{ $labels.job_name }} last succeeded
            {{ $value | humanizeDuration }} ago. Expected interval is 1 hour.
            Check job logs and upstream dependencies.
          runbook_url: "https://wiki.example.com/runbooks/pipeline-stale"

      # Alert when job execution time exceeds normal bounds.
      # Uses a 2x multiplier on the 95th percentile of recent runs.
      - alert: PipelineJobSlow
        expr: >
          pipeline_job_duration_seconds > 2 *
          quantile_over_time(0.95, pipeline_job_duration_seconds[7d])
        for: 10m
        labels:
          severity: warning
          team: data-engineering
        annotations:
          summary: "Pipeline job {{ $labels.job_name }} is running slower than usual"
          description: >
            Current duration: {{ $value | humanizeDuration }}.
            This exceeds 2x the 95th percentile over the past 7 days.
            Possible causes: upstream delays, resource contention, data volume spike.

      # Alert when error rate spikes above baseline.
      - alert: PipelineHighErrorRate
        expr: >
          rate(pipeline_errors_total[15m]) /
          rate(pipeline_rows_processed_total[15m]) > 0.01
        for: 10m
        labels:
          severity: critical
          team: data-engineering
        annotations:
          summary: "Pipeline {{ $labels.job_name }} error rate above 1%"
          description: >
            Error rate is {{ $value | humanizePercentage }} over the last 15 minutes.
            Threshold is 1%. Investigate error logs for root cause.

  - name: data_quality
    # Data freshness and volume anomaly alerts
    rules:

      # Alert when data in the target system is stale.
      # Measures time since the most recent record timestamp.
      - alert: DataFreshnessViolation
        expr: >
          pipeline_data_freshness_seconds > 3600
        for: 5m
        labels:
          severity: critical
          team: data-engineering
        annotations:
          summary: "Data freshness SLA violated for {{ $labels.dataset }}"
          description: >
            The most recent data in {{ $labels.dataset }} is
            {{ $value | humanizeDuration }} old. SLA requires data
            no older than 1 hour. Check pipeline execution and source availability.

      # Alert when processed row count drops significantly.
      # A sudden drop may indicate missing source data or filter bugs.
      - alert: DataVolumeAnomaly
        expr: >
          pipeline_rows_processed_total < 0.5 *
          avg_over_time(pipeline_rows_processed_total[7d])
        for: 30m
        labels:
          severity: warning
          team: data-engineering
        annotations:
          summary: "Row volume for {{ $labels.job_name }} dropped below 50% of 7-day average"
          description: >
            Processed {{ $value }} rows vs expected
            {{ avg_over_time(pipeline_rows_processed_total[7d]) }}.
            Verify source data availability and pipeline filters.

      # Alert when zero rows are processed for a job that normally produces data.
      - alert: DataVolumeZero
        expr: >
          pipeline_rows_processed_total == 0
          and on(job_name)
          avg_over_time(pipeline_rows_processed_total[7d]) > 100
        for: 15m
        labels:
          severity: critical
          team: data-engineering
        annotations:
          summary: "Zero rows processed by {{ $labels.job_name }}"
          description: >
            Pipeline {{ $labels.job_name }} processed zero rows but
            historically processes data. This likely indicates a
            source outage or pipeline failure.

  - name: infrastructure
    # Database and resource alerts relevant to pipeline operations
    rules:

      # Alert when database connection pool is nearly exhausted.
      - alert: ConnectionPoolNearLimit
        expr: >
          pg_stat_activity_count / pg_settings_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
          team: data-engineering
        annotations:
          summary: "Database connection utilization above 85%"
          description: >
            {{ $value | humanizePercentage }} of max connections in use.
            Pipeline jobs may fail to acquire connections. Consider
            increasing pool size or optimizing connection usage.

      # Alert when disk space on pipeline staging area is low.
      - alert: StagingDiskSpaceLow
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/data/staging"} /
           node_filesystem_size_bytes{mountpoint="/data/staging"}) < 0.15
        for: 10m
        labels:
          severity: warning
          team: data-engineering
        annotations:
          summary: "Pipeline staging disk below 15% free"
          description: >
            Only {{ $value | humanizePercentage }} free on /data/staging.
            Pipeline jobs may fail if they cannot write intermediate files.
            Clean up old staging data or expand the volume.

      # Alert when replication lag threatens data consistency.
      - alert: ReplicationLagHigh
        expr: >
          pg_replication_lag_seconds > 300
        for: 5m
        labels:
          severity: critical
          team: data-engineering
        annotations:
          summary: "Database replication lag exceeds 5 minutes"
          description: >
            Replication lag is {{ $value | humanizeDuration }}.
            Read replicas used by reporting pipelines may serve stale data.
            Check network connectivity and replica health.
